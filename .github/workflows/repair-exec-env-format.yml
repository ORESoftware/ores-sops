name: repair-exec-env-format

on:
  push:
    branches:
      - feat/exec-env-minimal-plaintext-20260915
    paths:
      - '.github/workflows/repair-exec-env-format.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/exec-env-minimal-plaintext-20260915
          fetch-depth: 0
      - name: Apply ciphertext-only dotenv filename repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'ores-sops';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  # \`input-type\` is a SOPS global flag and therefore must precede the exec-env
  # subcommand. SOPS then parses the tracked .env.enc ciphertext as dotenv and
  # injects decrypted values directly into the child environment. No env/dec
  # file, root .env symlink, shell sourcing, step output, or plaintext command
  # argument is created by this path. The command string contains only
  # caller-supplied argv.
  (cd "$root" && sops --input-type dotenv exec-env "$src" "$command_string")`;
          const after = `  # SOPS exec-env infers dotenv from the input filename. Copy only the already-
  # encrypted bytes into a private temporary *.env path so format inference is
  # correct without ever materializing plaintext. The tracked ciphertext remains
  # the sole repository source; the temporary file is mode 0600 and is removed
  # before this function returns. The child command still receives plaintext only
  # through its process environment.
  local tmp_dir tmp_env exec_status
  tmp_dir="$(mktemp -d "${TMPDIR:-/tmp}/ores-sops-exec.XXXXXX")" ||
    fail temporary_input_failed "could not create private encrypted exec input" "" "exec"
  chmod 700 "$tmp_dir"
  tmp_env="$tmp_dir/$name.env"
  umask 077
  if ! cat "$src" > "$tmp_env"; then
    rm -rf -- "$tmp_dir"
    fail temporary_input_failed "could not stage encrypted exec input" "" "exec"
  fi
  chmod 600 "$tmp_env"

  (cd "$root" && sops exec-env "$tmp_env" "$command_string")
  exec_status=$?
  rm -f -- "$tmp_env"
  rmdir -- "$tmp_dir"
  return "$exec_status"`;
          if (!source.includes(before)) throw new Error('expected exec-env block not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          bash -n ores-sops
          git diff --check
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'alex@oresoftware.com'
          git rm .github/workflows/repair-exec-env-format.yml
          git add ores-sops
          git commit -m 'fix: preserve encrypted dotenv format for exec-env'
          git push origin HEAD:feat/exec-env-minimal-plaintext-20260915
