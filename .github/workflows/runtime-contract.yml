name: runtime-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n ores-sops
          bash -n scripts/ores-sops-core
          bash -n scripts/ores-sops-telemetry
          bash -n tests/runtime-admission.sh
      - name: Runtime admission and telemetry redaction
        run: bash tests/runtime-admission.sh

  typespec-json-schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce independent TypeSpec and JSON Schema authorities
        run: |
          npx --yes --package=@oresoftware/typespec-json-schema-validator \
            tjsv check \
            --typespec=contracts/main.tsp \
            --schema=contracts/authored.schema.json \
            --instances=contracts/instances \
            --report=contracts/tjsv-report.json
