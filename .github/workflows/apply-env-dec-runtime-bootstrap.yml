name: Apply env/dec runtime bootstrap

on:
  push:
    branches:
      - agent/env-dec-runtime-bootstrap-20260811

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply exact-context patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              "ores-sops": "2e56143f082975f02cd9c7ed1386638b028ae800",
              "flake.nix": "0bd7aea67a248865e0cdb4dcfdb441e72e2af05c",
              "tests/ores-sops.bats": "c1f9069cea26b5881273160cec12151f291442f6",
              "README.md": "32342a54f187025b84bbdca9494728bd01dcec05",
          }

          def blob(path: str) -> str:
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)

          for path, wanted in expected.items():
              actual = blob(path)
              if actual != wanted:
                  raise RuntimeError(f"{path}: expected {wanted}, found {actual}")

          path = Path("ores-sops")
          text = path.read_text()
          text = replace_once(text, 'VERSION="0.3.1"', 'VERSION="0.3.2"', "version")
          text = replace_once(
              text,
              '''prepare_managed_tree() {
            local root
            root="$(repo_root)"
            assert_managed_tree_safe
            mkdir -p "$root/env/enc" "$root/env/dec"
            chmod 700 "$root/env/dec"
          }
          ''',
              '''ensure_dec_directory() {
            local root
            root="$(repo_root)"
            # Check before mkdir so a repository-controlled symlink cannot redirect
            # plaintext outside the repository. Existing non-directory forms fail too.
            assert_managed_tree_safe
            mkdir -p "$root/env/dec"
            chmod 700 "$root/env/dec"
          }

          prepare_managed_tree() {
            local root
            root="$(repo_root)"
            ensure_dec_directory
            assert_managed_tree_safe
            mkdir -p "$root/env/enc"
          }

          cmd_ensure_dec() {
            ensure_dec_directory
            printf 'ores-sops: ready env/dec (mode 0700, runtime-only)\\n'
          }
          ''',
              "managed-tree bootstrap",
          )
          text = replace_once(
              text,
              "  install-hooks           install safe refresh/pre-commit hooks\n",
              "  install-hooks           install safe refresh/pre-commit hooks\n"
              "  ensure-dec              create the ignored runtime env/dec directory, mode 0700\n",
              "usage",
          )
          text = replace_once(
              text,
              '''main() {
            local cmd="${1:-}"
            [ "$#" -gt 0 ] && shift || true
            case "$cmd" in
          ''',
              '''main() {
            local cmd="${1:-}"
            [ "$#" -gt 0 ] && shift || true

            # env/dec is intentionally absent from Git. Every managed entry point creates
            # the working directory before status, decryption, audit, hooks, or cleanup.
            # Help and version remain side-effect free.
            case "$cmd" in
              init|use|encrypt|edit|diff|status|refresh|verify|precommit|lock|install-hooks|ensure-dec)
                ensure_dec_directory
                ;;
            esac

            case "$cmd" in
          ''',
              "main bootstrap",
          )
          text = replace_once(
              text,
              '    install-hooks) cmd_install_hooks "$@" ;;\n',
              '    install-hooks) cmd_install_hooks "$@" ;;\n'
              '    ensure-dec) cmd_ensure_dec "$@" ;;\n',
              "dispatch",
          )
          path.write_text(text)

          path = Path("flake.nix")
          text = path.read_text()
          text = replace_once(
              text,
              '''        if command -v ores-sops >/dev/null 2>&1 && git rev-parse --git-dir >/dev/null 2>&1; then
                    # .git/hooks is not shared by git, so every clone needs this once.
          ''',
              '''        if command -v ores-sops >/dev/null 2>&1 && git rev-parse --git-dir >/dev/null 2>&1; then
                    # env/dec is runtime-only and cannot exist in a fresh clone.
                    # Create it before every other Nix/SOPS integration path.
                    ores-sops ensure-dec
                    # .git/hooks is not shared by git, so every clone needs this once.
          ''',
              "Nix shell hook",
          )
          path.write_text(text)

          path = Path("tests/ores-sops.bats")
          text = path.read_text()
          marker = '@test "only dev and prod environment names are accepted" {\n'
          addition = '''@test "every managed command recreates ignored env/dec with mode 0700" {
            commands=(
              "ensure-dec"
              "status"
              "verify"
              "precommit"
              "install-hooks --quiet"
              "lock"
            )

            for command in "${commands[@]}"; do
              rm -rf env/dec
              run bash -c "ores-sops $command"
              [ "$status" -eq 0 ]
              [ -d env/dec ]
              [ ! -L env/dec ]
              [ "$(stat -c '%a' env/dec 2>/dev/null || stat -f '%Lp' env/dec)" = "700" ]
              git check-ignore --no-index -q env/dec/runtime.env
              [ -z "$(git ls-files -- env/dec)" ]
            done
          }

          @test "runtime bootstrap refuses a symlinked env/dec without touching its target" {
            outside="$BATS_TEST_TMPDIR/outside-runtime-dec"
            mkdir -p "$outside"
            rm -rf env/dec
            ln -s "$outside" env/dec

            run ores-sops status
            [ "$status" -ne 0 ]
            [[ "$output" == *"managed path must not be a symlink"* ]]
            [ -z "$(find "$outside" -mindepth 1 -maxdepth 1 -print -quit)" ]
          }

          '''
          text = replace_once(text, marker, addition + marker, "Bats regression tests")
          path.write_text(text)

          path = Path("README.md")
          text = path.read_text()
          text = replace_once(
              text,
              '''.env -> env/dec/dev.env   # or prod
          ```

          The root `.env` is a **relative managed symlink**, never a copied plaintext file.''',
              '''.env -> env/dec/dev.env   # or prod
          ```

          The `env/dec/` directory itself is runtime-only: it is not represented by a
          tracked `.gitkeep`, README, or placeholder. Every managed command and the Nix
          shell hook create it with `mkdir -p` and enforce mode `0700`.

          The root `.env` is a **relative managed symlink**, never a copied plaintext file.''',
              "README runtime-only contract",
          )
          text = replace_once(
              text,
              "ores-sops install-hooks\n```\n",
              "ores-sops install-hooks\nores-sops ensure-dec\n```\n",
              "README command list",
          )
          text = replace_once(
              text,
              "`use` decrypts into an owner-only temporary file under `env/dec/`, validates successful SOPS completion and dotenv syntax/duplicate keys, applies mode `0600`, and only then atomically renames it into `env/dec/dev.env` or `env/dec/prod.env`. The managed `env/dec` directory is mode `0700` on POSIX platforms.",
              "Every managed command first creates the ignored `env/dec/` directory if it is absent, rejects symlink/non-directory forms, and applies mode `0700`. `use` then decrypts into an owner-only temporary file under `env/dec/`, validates successful SOPS completion and dotenv syntax/duplicate keys, applies mode `0600`, and only then atomically renames it into `env/dec/dev.env` or `env/dec/prod.env`.",
              "README activation semantics",
          )
          old = "The default package pins SOPS, age, Git, and shell dependencies. The flake also exposes `packages.ores-sops-fleet-audit` / `apps.fleet-audit`. The development shell includes both commands plus Bats and ShellCheck."
          text = replace_once(
              text,
              old,
              old + "\n\nThe exported shell hook calls `ores-sops ensure-dec` before hook installation or refresh, so a fresh clone never depends on an impossible tracked empty directory.",
              "README Nix semantics",
          )
          path.write_text(text)
          PY

      - name: Validate and commit intended diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-env-dec-runtime-bootstrap.yml
          bash -n ores-sops
          git diff --check
          grep -q 'mkdir -p "$root/env/dec"' ores-sops
          grep -q 'ores-sops ensure-dec' flake.nix
          test -z "$(git ls-files -- env/dec)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ensure env/dec exists for every managed command"
          git push origin HEAD:${GITHUB_REF_NAME}
