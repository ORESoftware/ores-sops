name: Apply exact rule counter fix

on:
  push:
    branches:
      - feat/stage-environment-contract-v0.4

permissions:
  contents: write

concurrency:
  group: apply-exact-rule-counter-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[exact-counter-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply portable counter
        run: python3 scripts/fix-exact-rule-counter.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          bash -n ores-sops
          git diff --check

      - name: Remove one-time fix machinery
        run: rm scripts/fix-exact-rule-counter.py .github/workflows/apply-exact-rule-counter-fix.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware stage contract automation'
          git config user.email 'bot@oresoftware.dev'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: count exact SOPS rules portably [exact-counter-applied]'
          git push origin HEAD
