name: SOPS dotenv policy smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  keyless-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n ./ores-sops

      - name: Clean-repository policy smoke
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          home="$(mktemp -d)"
          trap 'rm -rf "$work" "$home"' EXIT

          git -C "$work" init -q
          mkdir -p "$home/.config/sops/age"
          printf '# public key: age1%s\n' "$(printf 'q%.0s' {1..58})" > "$home/.config/sops/age/keys.txt"

          (
            cd "$work"
            HOME="$home" "$GITHUB_WORKSPACE/ores-sops" init

            git check-ignore --no-index -q .env
            git check-ignore --no-index -q root.env
            git check-ignore --no-index -q nested/child.env
            git check-ignore --no-index -q nested/deeper/child.env
            git check-ignore --no-index -q env/dec/dev.env
            git check-ignore --no-index -q env/dec/prod.env

            ! git check-ignore --no-index -q env/enc/dev.env.enc
            ! git check-ignore --no-index -q env/enc/prod.env.enc

            grep -Fxq '*.env' .gitignore
            grep -Fxq '*/*.env' .gitignore
            grep -Fxq '*/**/*.env' .gitignore
            grep -Fxq '/env/enc/*' .gitignore
            grep -Fxq '!/env/enc/dev.env.enc' .gitignore
            grep -Fxq '!/env/enc/prod.env.enc' .gitignore

            grep -Fq 'path_regex: ^env/enc/dev\.env\.enc$' .sops.yaml
            grep -Fq 'path_regex: ^env/enc/prod\.env\.enc$' .sops.yaml

            if "$GITHUB_WORKSPACE/ores-sops" use app >/tmp/ores-sops-app.out 2>&1; then
              echo 'expected unsupported environment to fail' >&2
              exit 1
            fi
            grep -q "unsupported environment 'app'" /tmp/ores-sops-app.out
          )
