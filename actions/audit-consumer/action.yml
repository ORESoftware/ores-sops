name: Audit ores-sops consumer

description: Fail closed when a checked-out repository violates the ores-sops encrypted environment contract.

inputs:
  root:
    description: Repository-relative path to audit. The caller repository must already be checked out.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Audit encrypted environment contract
      shell: bash
      env:
        ORES_SOPS_AUDIT_ROOT: ${{ github.workspace }}/${{ inputs.root }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/../../tools/audit_env_contract.py"
